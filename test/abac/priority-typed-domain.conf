[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, priority, obj, act, eft

[role_definition]
g = _, _, _

[policy_effect]
e = priority(p.eft) || deny

[matchers]
m = g(r.sub.Name, p.sub, r.dom.Tenant) && r.dom.Tenant == p.dom && keyMatch(r.obj.Path, p.obj) && r.obj.Active && r.obj.Score < 3 && r.act == p.act
