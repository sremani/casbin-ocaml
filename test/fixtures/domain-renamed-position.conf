[request_definition]
r = who, resource, verb, tenant

[policy_definition]
p = role, asset, operation, organization

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.who, p.role, r.tenant) && r.tenant == p.organization && r.resource == p.asset && r.verb == p.operation
